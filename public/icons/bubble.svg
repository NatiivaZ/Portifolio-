<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" fill="none">
  <defs>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066FF"/>
      <stop offset="100%" style="stop-color:#00D4FF"/>
    </linearGradient>
  </defs>
  
  <!-- Background card -->
  <rect width="280" height="80" rx="16" fill="#0A1929"/>
  <rect width="280" height="80" rx="16" stroke="#0066FF" stroke-width="1" fill="none" opacity="0.3"/>
  
  <!-- Bubble Logo Mark - Official style speech bubble -->
  <g transform="translate(20, 14)">
    <!-- Main bubble shape -->
    <path d="M26 4 C12 4 4 14 4 26 C4 38 12 48 26 48 C30 48 34 47 37 45 L46 50 L44 42 C48 38 50 32 50 26 C50 14 40 4 26 4 Z" 
          fill="url(#bubbleGrad)"/>
    <!-- Inner highlight -->
    <ellipse cx="18" cy="18" rx="8" ry="6" fill="white" opacity="0.25"/>
    <!-- Dots inside bubble -->
    <circle cx="18" cy="28" r="3" fill="white" opacity="0.9"/>
    <circle cx="26" cy="28" r="3" fill="white" opacity="0.9"/>
    <circle cx="34" cy="28" r="3" fill="white" opacity="0.9"/>
  </g>
  
  <!-- Bubble Text -->
  <text x="80" y="50" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="white">Bubble</text>
</svg>
