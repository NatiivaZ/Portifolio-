<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" fill="none">
  <defs>
    <linearGradient id="ffGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="50%" style="stop-color:#A855F7"/>
      <stop offset="100%" style="stop-color:#EC4899"/>
    </linearGradient>
  </defs>
  
  <!-- Background card -->
  <rect width="280" height="80" rx="16" fill="#0F0F23"/>
  <rect width="280" height="80" rx="16" stroke="#7C3AED" stroke-width="1" fill="none" opacity="0.3"/>
  
  <!-- FlutterFlow Logo Mark - Official style lightning bolt / flow -->
  <g transform="translate(20, 12)">
    <!-- The iconic FlutterFlow mark - stylized double chevron/flow -->
    <path d="M10 28 L22 16 L22 28 L34 16" stroke="url(#ffGradient)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M10 40 L22 28 L22 40 L34 28" stroke="url(#ffGradient)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M10 52 L22 40 L22 52 L34 40" stroke="url(#ffGradient)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  
  <!-- FlutterFlow Text -->
  <text x="70" y="50" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="600" fill="white">FlutterFlow</text>
</svg>
